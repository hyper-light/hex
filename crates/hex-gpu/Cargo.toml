[package]
name = "hex-gpu"
description = "Hex's GPU telemetry: a node's NVIDIA (NVML) and AMD (amdgpu sysfs) GPUs, their identity once and their load per sample, for the scheduler to balance on beside CPU load"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

# NVML loaded at run time (dlopen), and the OS's error numbers amdgpu's counters answer with.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

# NVML loaded at run time (LoadLibraryExW and GetProcAddress).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# The hardware check's counting allocator (tests/hardware.rs): a sample allocates nothing, counted by
# every byte asked for (`stats`), not only those still held.
cap = { version = "0.1.2", features = ["stats"] }
tempfile.workspace = true

[lints]
workspace = true
