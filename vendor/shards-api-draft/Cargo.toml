# Shards' `shards-api` (crates/api) and the crates it needs (abi, afunix on Windows,
# testdir for its tests), at hyper-light/shards p/integrate-1107 c55d85db9b8c88656b4fe4bd582f5ebe6500e959
# (2026-11-09; SAID da8bcd272, vmm-round2 7ddceb974). D12: the kept console size is learned per kernel pin,
# `--console-said N` is passed to Shards, and the client's refusal tail is derived from that size. Real guests
# require a Shards binary that supports `--console-said` (this revision or a descendant); the guest kernel pin
# is unchanged. Hex's borrowed connector patch is recorded in HEX-PATCHES.md; the root keeps Shards' settings below (its Cargo.toml
# is unchanged since f2e5a8ca1), with only these four workspace members. It moves to vendor/shards, recorded in
# vendor/MANIFEST.toml, once Shards lands the crate on main (docs/design/shards-guest.md Appendix A).
[workspace]
members = ["crates/abi", "crates/api", "crates/afunix", "crates/testdir"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/hyper-light/shards"
rust-version = "1.98.1"

# Versions are pinned once here.
[workspace.dependencies]
libc = "0.2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
# Production code never panics (CLAUDE.md); clippy.toml exempts tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
print_stdout = "deny"
print_stderr = "deny"
