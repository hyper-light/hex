[package]
name = "hex-guest-hello-census"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
autobins = false
autobenches = false

# Explicit benchmark tool, outside Hex's production workspace/installables.
[workspace]

[[bin]]
name = "hex-guest-hello-census"
path = "benches/main.rs"

[dependencies]
hex-api = { path = "../../../../../crates/hex-api" }
hex-client = { path = "../../../../../crates/hex-client" }
hex-core = { path = "../../../../../crates/hex-core" }
hex-node = { path = "../../../../../crates/hex-node" }
hex-runtime = { path = "../../../../../crates/hex-runtime" }
shards-api = { path = "../../../../../vendor/shards-api-draft/crates/api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"

[patch.crates-io]
seccompiler = { path = "../../../../../vendor/seccompiler" }
hyper-swim = { path = "../../../../../vendor/hyper-raft/crates/hyper-swim" }
hyper-timing = { path = "../../../../../vendor/hyper-raft/crates/hyper-timing" }
shards-api = { path = "../../../../../vendor/shards-api-draft/crates/api" }

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
debug = "line-tables-only"

[lints.rust]
unsafe_code = "deny"
